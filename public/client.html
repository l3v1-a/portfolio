<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Levi — Client Review</title><style>:root{--bg:#080708;--panel:#121012;--text:#f2eadb;--muted:#9d9488;--gold:#d5ab62;--line:#2a2523}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,sans-serif}.wrap{width:min(1100px,calc(100% - 36px));margin:auto;padding:36px 0 80px}.k{color:var(--gold);font-size:12px;text-transform:uppercase;letter-spacing:.12em}.hero{display:grid;grid-template-columns:1.3fr .7fr;gap:25px;align-items:start}.video{aspect-ratio:16/9;background:#000;border:1px solid var(--line)}video{width:100%;height:100%;object-fit:contain}.card{background:var(--panel);border:1px solid var(--line);padding:18px;margin-top:18px}.comment{padding:12px 0;border-top:1px solid var(--line)}textarea,input{width:100%;background:#0d0b0c;color:var(--text);border:1px solid var(--line);padding:10px;margin-top:8px}.btn{margin-top:10px;background:var(--gold);border:0;padding:10px 14px;font-weight:700}.muted{color:var(--muted)}@media(max-width:800px){.hero{grid-template-columns:1fr}}</style></head><body><main class="wrap" id="app"><p>Loading client review…</p></main><script>
(async()=>{const token=location.pathname.split('/').pop(),app=document.getElementById('app');const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#039;','"':'&quot;'}[c]));function renderVideoEmbed(url,poster=''){if(!url)return '';const u=String(url).trim(),escUrl=esc(u),escPoster=esc(poster);const dMatch=u.match(/\/file\/d\/([a-zA-Z0-9_-]+)/)||u.match(/[?&]id=([a-zA-Z0-9_-]+)/);if(dMatch&&(u.includes('drive.google.com')||u.includes('docs.google.com')))return `<iframe src="https://drive.google.com/file/d/${dMatch[1]}/preview" style="width:100%;height:100%;border:0;" allow="autoplay; fullscreen" allowfullscreen></iframe>`;const ytMatch=u.match(/(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?|shorts)\/|.*[?&]v=)|youtu\.be\/)([^"&?\/\s]{11})/);if(ytMatch)return `<iframe src="https://www.youtube.com/embed/${ytMatch[1]}?rel=0" style="width:100%;height:100%;border:0;" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;const vmMatch=u.match(/(?:vimeo\.com\/|player\.vimeo\.com\/video\/)(\d+)/);if(vmMatch)return `<iframe src="https://player.vimeo.com/video/${vmMatch[1]}" style="width:100%;height:100%;border:0;" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe>`;return `<video controls playsinline poster="${escPoster}"><source src="${escUrl}"></video>`};try{let r=await fetch('/api/client/'+token),d=await r.json();if(!r.ok)throw new Error(d.error);app.innerHTML=`<div class="k">Client presentation</div><div class="hero"><div><h1>${esc(d.title)}</h1><p class="muted">${esc(d.description||'')}</p><div class="video">${d.video_url?renderVideoEmbed(d.video_url,d.poster_url):'<div style="height:100%;display:grid;place-items:center">Video not connected yet.</div>'}</div></div><aside><div class="card"><div class="k">Client</div><h3>${esc(d.client_name)}</h3><p class="muted">${esc(d.company||'')}</p></div><div class="card"><div class="k">Review</div><form id="cf"><label>Name<input name="author_name" required></label><label>Timestamp (seconds)<input name="timestamp_seconds" type="number" step="0.01"></label><label>Comment<textarea name="body" required></textarea></label><button class="btn">Add comment</button></form></div></aside></div><div class="card"><div class="k">Comments</div><div id="comments">${(d.comments||[]).map(c=>`<div class="comment"><strong>${esc(c.author_name)}</strong> <span class="muted">${c.timestamp_seconds!=null?'@ '+c.timestamp_seconds+'s':''}</span><div>${esc(c.body)}</div></div>`).join('')||'<p class="muted">No comments yet.</p>'}</div></div>`;document.getElementById('cf').onsubmit=async e=>{e.preventDefault();const o=Object.fromEntries(new FormData(e.target));const rr=await fetch('/api/client/'+token+'/comments',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(o)});if(rr.ok)location.reload();else{const x=await rr.json();alert(x.error)}}}catch(e){app.innerHTML='<div class="card"><h1>Client link unavailable</h1><p class="muted">'+esc(e.message)+'</p></div>'}})();
</script></body></html>
