<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Levi Admin</title>
<style>
:root{--bg:#0a0808;--panel:#121012;--text:#f3ead9;--muted:#9e9488;--gold:#d5ab62;--red:#dd4a3a;--line:#2a2523;--input:#0d0b0c;--green:#76b889}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}a{color:inherit}.hidden{display:none!important}.shell{display:grid;grid-template-columns:240px 1fr;min-height:100vh}.side{position:sticky;top:0;height:100vh;border-right:1px solid var(--line);padding:24px;background:#0b0909}.brand{font-family:Georgia,serif;font-size:28px}.sub{color:var(--muted);font-size:12px;margin-top:4px}.nav{display:grid;gap:7px;margin-top:30px}.nav button{border:1px solid transparent;background:transparent;color:var(--muted);text-align:left;padding:11px 12px;border-radius:3px}.nav button.active,.nav button:hover{color:var(--text);border-color:var(--line);background:var(--panel)}.main{padding:28px;max-width:1500px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:24px}.top h1{margin:0;font:400 38px/1 Georgia,serif}.pill{padding:7px 10px;border:1px solid var(--line);font-size:12px;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.card{background:var(--panel);border:1px solid var(--line);padding:18px;border-radius:3px}.card .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}.card .v{font-size:30px;margin-top:7px}.panel{background:var(--panel);border:1px solid var(--line);padding:20px;border-radius:3px;margin-top:18px}.panel h2{font:400 25px Georgia,serif;margin:0 0 15px}.actions{display:flex;gap:10px;flex-wrap:wrap}.btn{background:var(--gold);color:#1d1307;border:0;padding:10px 14px;font-weight:700;border-radius:2px}.btn.secondary{background:transparent;border:1px solid var(--line);color:var(--text)}.btn.danger{background:var(--red);color:white}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:11px 10px;border-top:1px solid var(--line);text-align:left;vertical-align:top;font-size:13px}.table th{color:var(--muted);font-weight:500}.status{padding:4px 7px;border:1px solid var(--line);font-size:11px}.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.field{display:grid;gap:6px;margin-bottom:12px}.field label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}.field input,.field textarea,.field select{width:100%;background:var(--input);border:1px solid var(--line);color:var(--text);padding:10px 11px;border-radius:2px}.field textarea{min-height:90px;resize:vertical}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.checkbox{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted)}.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:grid;place-items:center;padding:20px;z-index:10}.modalBox{width:min(1100px,100%);max-height:92vh;overflow:auto;background:#111;border:1px solid var(--line);padding:22px}.modalHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.toast{position:fixed;right:18px;bottom:18px;padding:12px 14px;border:1px solid var(--line);background:#171313;display:none}.toast.show{display:block}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.loginBox{width:min(420px,100%);background:var(--panel);border:1px solid var(--line);padding:28px}.loginBox h1{font:400 32px Georgia,serif;margin:0 0 6px}.muted{color:var(--muted)}pre{white-space:pre-wrap;background:#0b0909;border:1px solid var(--line);padding:12px;overflow:auto}.media{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.mediaItem{border:1px solid var(--line);padding:10px}.mediaItem img,.mediaItem video{width:100%;aspect-ratio:16/9;object-fit:cover;background:#000}.mini{font-size:11px;color:var(--muted)}
@media(max-width:1000px){.shell{grid-template-columns:1fr}.side{position:relative;height:auto;border-right:0;border-bottom:1px solid var(--line)}.nav{grid-template-columns:repeat(4,1fr)}.grid{grid-template-columns:repeat(2,1fr)}.media{grid-template-columns:repeat(2,1fr)}}
@media(max-width:650px){.main{padding:18px}.grid,.two,.three,.media{grid-template-columns:1fr}.nav{grid-template-columns:1fr 1fr}.top h1{font-size:30px}}
</style></head><body>
<div id="login" class="login"><div class="loginBox"><h1>Levi Admin</h1><p class="muted">Private portfolio control room.</p><form id="loginForm"><div class="field"><label>Email</label><input name="email" type="email" required value="admin@example.com"></div><div class="field"><label>Password</label><input name="password" type="password" required></div><button class="btn" type="submit">Sign in →</button><p id="loginError" class="muted"></p></form></div></div>
<div id="app" class="shell hidden"><aside class="side"><div class="brand">Levi</div><div class="sub">Portfolio Admin</div><div class="nav"><button data-page="dashboard" class="active">Dashboard</button><button data-page="projects">Projects</button><button data-page="services">Services</button><button data-page="pricing">Pricing</button><button data-page="media">Media Library</button><button data-page="inquiries">Inquiries</button><button data-page="settings">Settings</button><button id="logoutBtn">Logout</button></div></aside><main class="main"><div class="top"><div><h1 id="pageTitle">Dashboard</h1><div class="muted" id="pageSub">Manage the portfolio without touching code.</div></div><a class="pill" href="/" target="_blank">Open public site ↗</a></div><div id="content"></div></main></div>
<div id="modal" class="modal hidden"><div class="modalBox"><div class="modalHead"><strong id="modalTitle">Project</strong><button class="btn secondary" id="closeModal">Close</button></div><div id="modalBody"></div></div></div><div id="toast" class="toast"></div>
<script>
(()=>{const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];let state={page:'dashboard',projects:[],services:[],pricing:[],settings:{},media:[],inquiries:[]};
async function api(url,opts={}){const r=await fetch(url,opts);const data=await r.json().catch(()=>({}));if(!r.ok)throw new Error(data.error||'Request failed');return data}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2600)}
async function boot(){try{await api('/api/admin/session');$('#login').classList.add('hidden');$('#app').classList.remove('hidden');await refresh();render()}catch{}}
async function refresh(){state.projects=await api('/api/admin/projects');state.services=await api('/api/admin/services');state.pricing=await api('/api/admin/pricing');state.settings=await api('/api/admin/settings');state.media=await api('/api/admin/media');state.inquiries=await api('/api/admin/inquiries')}
function render(){document.querySelectorAll('.nav button[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===state.page));const titles={dashboard:['Dashboard','A quick view of portfolio operations.'],projects:['Projects','Create, edit, publish and manage project storytelling.'],services:['Services','Manage public service cards.'],pricing:['Pricing','Change packages and prices without code.'],media:['Media Library','Upload posters, videos, images and audio.'],inquiries:['Inquiries','Private project briefs submitted from the site.'],settings:['Settings','Global identity, links, theme and contact information.']};$('#pageTitle').textContent=titles[state.page][0];$('#pageSub').textContent=titles[state.page][1];({dashboard:renderDashboard,projects:renderProjects,services:renderServices,pricing:renderPricing,media:renderMedia,inquiries:renderInquiries,settings:renderSettings}[state.page])()}
function renderDashboard(){const published=state.projects.filter(p=>p.status==='published').length,newI=state.inquiries.filter(x=>x.status==='new').length;$('#content').innerHTML=`<div class="grid"><div class="card"><div class="k">Projects</div><div class="v">${state.projects.length}</div></div><div class="card"><div class="k">Published</div><div class="v">${published}</div></div><div class="card"><div class="k">New inquiries</div><div class="v">${newI}</div></div><div class="card"><div class="k">Media assets</div><div class="v">${state.media.length}</div></div></div><div class="panel"><h2>Portfolio status</h2><div class="actions"><a class="btn" href="/" target="_blank">View site</a><button class="btn secondary" onclick="window.location='/admin#projects'">Manage projects</button></div></div>`}
function renderProjects(){const rows=state.projects.map(p=>`<tr><td><strong>${esc(p.title)}</strong><div class="mini">${esc(p.slug)}</div></td><td>${esc(p.category)}</td><td><span class="status">${esc(p.status)}</span></td><td>${p.featured?'Yes':'—'}</td><td><div class="actions"><button class="btn secondary" data-edit="${p.id}">Edit</button><button class="btn danger" data-del="${p.id}">Delete</button></div></td></tr>`).join('');$('#content').innerHTML=`<div class="actions"><button class="btn" id="newProject">+ New Project</button></div><div class="panel"><table class="table"><thead><tr><th>Project</th><th>Category</th><th>Status</th><th>Featured</th><th></th></tr></thead><tbody>${rows||'<tr><td colspan="5">No projects yet.</td></tr>'}</tbody></table></div>`;$('#newProject').onclick=()=>openProjectForm();$$('[data-edit]').forEach(b=>b.onclick=()=>openProjectForm(state.projects.find(p=>p.id==b.dataset.edit)));$$('[data-del]').forEach(b=>b.onclick=async()=>{if(confirm('Delete this project?')){await api('/api/admin/projects/'+b.dataset.del,{method:'DELETE'});await refresh();render();toast('Project deleted')}})}
function projectForm(p={}){const j=x=>JSON.stringify(x||{},null,2);return `<form id="projectForm"><div class="two"><div class="field"><label>Title *</label><input name="title" required value="${esc(p.title||'')}"></div><div class="field"><label>Slug</label><input name="slug" value="${esc(p.slug||'')}"></div></div><div class="three"><div class="field"><label>Category *</label><input name="category" required value="${esc(p.category||'Reels / Short-form')}"></div><div class="field"><label>Year</label><input name="year" type="number" value="${esc(p.year||new Date().getFullYear())}"></div><div class="field"><label>Role</label><input name="role" value="${esc(p.role||'Editor')}"></div></div><div class="two"><div class="field"><label>Client</label><input name="client" value="${esc(p.client||'')}"></div><div class="field"><label>Tools</label><input name="tools" value="${esc(p.tools||'Premiere Pro')}"></div></div><div class="field"><label>Description</label><textarea name="description">${esc(p.description||'')}</textarea></div><div class="two"><div class="field"><label>Objective</label><textarea name="objective">${esc(p.objective||'')}</textarea></div><div class="field"><label>Editing approach</label><textarea name="editing_approach">${esc(p.editing_approach||'')}</textarea></div></div><div class="three"><div class="field"><label>Thumbnail URL</label><input name="thumbnail_url" value="${esc(p.thumbnail_url||'')}"></div><div class="field"><label>Poster URL</label><input name="poster_url" value="${esc(p.poster_url||'')}"></div><div class="field"><label>Video URL</label><input name="video_url" value="${esc(p.video_url||'')}"></div></div><div class="three"><div class="field"><label>Raw Footage URL</label><input name="raw_footage_url" value="${esc(p.raw_footage_url||'')}"></div><div class="field"><label>Before URL</label><input name="before_url" value="${esc(p.before_url||'')}"></div><div class="field"><label>After URL</label><input name="after_url" value="${esc(p.after_url||'')}"></div></div><div class="field"><label>Editing DNA (comma separated)</label><input name="editing_dna" value="${esc(p.editing_dna||'')}"></div><div class="field"><label>Markers JSON</label><textarea name="markers">${j(p.markers||[])}</textarea></div><div class="field"><label>Breakdown JSON</label><textarea name="breakdown">${j(p.breakdown||[])}</textarea></div><div class="field"><label>Timeline JSON</label><textarea name="timeline">${j(p.timeline||{})}</textarea></div><div class="two"><div class="field"><label>Status</label><select name="status"><option ${p.status==='draft'?'selected':''}>draft</option><option ${p.status==='published'?'selected':''}>published</option><option ${p.status==='scheduled'?'selected':''}>scheduled</option><option ${p.status==='archived'?'selected':''}>archived</option></select></div><div class="field"><label>Publish at (optional ISO date)</label><input name="publish_at" value="${esc(p.publish_at||'')}"></div></div><label class="checkbox"><input type="checkbox" name="featured" ${p.featured?'checked':''}> Featured project</label><div class="actions" style="margin-top:16px"><button class="btn" type="submit">Save project</button></div></form>`}
function openProjectForm(p){$('#modalTitle').textContent=p?'Edit project':'New project';$('#modalBody').innerHTML=projectForm(p||{});$('#modal').classList.remove('hidden');$('#projectForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),o={};f.forEach((v,k)=>{if(['markers','breakdown','timeline'].includes(k)){try{o[k]=JSON.parse(v||'[]')}catch{throw new Error('Invalid JSON in '+k)}}else if(k==='featured')o[k]=true;else o[k]=v});if(!f.has('featured'))o.featured=false;try{if(p)await api('/api/admin/projects/'+p.id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(o)});else await api('/api/admin/projects',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(o)});$('#modal').classList.add('hidden');await refresh();render();toast('Project saved')}catch(err){alert(err.message)}}}
function renderServices(){$('#content').innerHTML=`<div class="panel"><table class="table"><thead><tr><th>Service</th><th>Description</th><th>Tools</th><th>Published</th><th></th></tr></thead><tbody>${state.services.map(s=>`<tr><td><input data-svc-title="${s.id}" value="${esc(s.title)}"></td><td><input data-svc-desc="${s.id}" value="${esc(s.description||'')}"></td><td><input data-svc-tools="${s.id}" value="${esc(s.tools||'')}"></td><td><input data-svc-pub="${s.id}" type="checkbox" ${s.published?'checked':''}></td><td><button class="btn secondary" data-svc-save="${s.id}">Save</button></td></tr>`).join('')}</tbody></table></div>`;$$('[data-svc-save]').forEach(b=>b.onclick=async()=>{const id=b.dataset.svcSave;await api('/api/admin/services/'+id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:$(`[data-svc-title="${id}"]`).value,description:$(`[data-svc-desc="${id}"]`).value,tools:$(`[data-svc-tools="${id}"]`).value,published:$(`[data-svc-pub="${id}"]`).checked,deliverables:state.services.find(x=>x.id==id).deliverables,sort_order:state.services.find(x=>x.id==id).sort_order})});await refresh();render();toast('Service updated')})}
function renderPricing(){$('#content').innerHTML=`<div class="panel"><table class="table"><thead><tr><th>Package</th><th>Price</th><th>Revisions</th><th>Turnaround</th><th>Published</th><th></th></tr></thead><tbody>${state.pricing.map(p=>`<tr><td><input data-pname="${p.id}" value="${esc(p.name)}"></td><td><input data-pprice="${p.id}" value="${esc(p.price||'Custom quote')}"></td><td><input data-prev="${p.id}" value="${esc(p.revisions||'')}"></td><td><input data-pturn="${p.id}" value="${esc(p.turnaround||'')}"></td><td><input data-ppub="${p.id}" type="checkbox" ${p.published?'checked':''}></td><td><button class="btn secondary" data-psave="${p.id}">Save</button></td></tr>`).join('')}</tbody></table></div>`;$$('[data-psave]').forEach(b=>b.onclick=async()=>{const id=b.dataset.psave,x=state.pricing.find(p=>p.id==id);await api('/api/admin/pricing/'+id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:$(`[data-pname="${id}"]`).value,description:x.description,price:$(`[data-pprice="${id}"]`).value,currency:x.currency,deliverables:x.deliverables,revisions:$(`[data-prev="${id}"]`).value,turnaround:$(`[data-pturn="${id}"]`).value,features:x.features,featured:x.featured,availability:x.availability,cta_label:x.cta_label,sort_order:x.sort_order,published:$(`[data-ppub="${id}"]`).checked})});await refresh();render();toast('Pricing updated')})}
function renderMedia(){$('#content').innerHTML=`<div class="panel"><h2>Upload asset</h2><form id="uploadForm"><input name="file" type="file" accept="video/*,image/*,audio/*,.pdf" required><button class="btn" type="submit" style="margin-top:12px">Upload</button></form></div><div class="panel"><div class="media">${state.media.map(m=>`<div class="mediaItem">${m.type==='image'?`<img src="${m.url}" alt="">`:m.type==='video'?`<video src="${m.url}" controls preload="metadata"></video>`:`<div style="aspect-ratio:16/9;display:grid;place-items:center;border:1px solid var(--line)">${esc(m.original_name)}</div>`}<div style="margin-top:8px"><strong>${esc(m.original_name)}</strong><div class="mini">${Math.round(m.size_bytes/1024/1024*10)/10} MB · <code>${esc(m.url)}</code></div><button class="btn danger" data-media-del="${m.id}" style="margin-top:8px">Delete</button></div></div>`).join('')}</div></div>`;$('#uploadForm').onsubmit=async e=>{e.preventDefault();await api('/api/admin/media',{method:'POST',body:new FormData(e.target)});e.target.reset();await refresh();render();toast('Asset uploaded')};$$('[data-media-del]').forEach(b=>b.onclick=async()=>{if(confirm('Delete asset?')){await api('/api/admin/media/'+b.dataset.mediaDel,{method:'DELETE'});await refresh();render();toast('Asset deleted')}})}
function renderInquiries(){const rows=state.inquiries.map(x=>`<tr><td><strong>${esc(x.name)}</strong><div class="mini">${esc(x.email)}</div></td><td>${esc(x.service||x.project_type||'')}</td><td>${esc(x.budget||'')}</td><td><select data-istatus="${x.id}"><option ${x.status==='new'?'selected':''}>new</option><option ${x.status==='contacted'?'selected':''}>contacted</option><option ${x.status==='discussion'?'selected':''}>discussion</option><option ${x.status==='proposal'?'selected':''}>proposal</option><option ${x.status==='won'?'selected':''}>won</option><option ${x.status==='lost'?'selected':''}>lost</option></select></td><td><span class="mini">${esc(x.message||'').slice(0,160)}</span></td></tr>`).join('');$('#content').innerHTML=`<div class="panel"><table class="table"><thead><tr><th>Lead</th><th>Service</th><th>Budget</th><th>Status</th><th>Brief</th></tr></thead><tbody>${rows||'<tr><td colspan="5">No inquiries yet.</td></tr>'}</tbody></table></div>`;$$('[data-istatus]').forEach(s=>s.onchange=async()=>{await api('/api/admin/inquiries/'+s.dataset.istatus,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:s.value,priority:'normal'})});toast('Lead updated')})}
function renderSettings(){const s=state.settings||{};const fields=['name','alias','title','tagline','location','availability','email','whatsapp','instagram','fiverr','showreel','bio','theme'];$('#content').innerHTML=`<div class="panel"><form id="settingsForm">${fields.map(k=>`<div class="field"><label>${k}</label><input name="${k}" value="${esc(s[k]||'')}"></div>`).join('')}<button class="btn" type="submit">Save settings</button></form></div>`;$('#settingsForm').onsubmit=async e=>{e.preventDefault();const o={};new FormData(e.target).forEach((v,k)=>o[k]=v);await api('/api/admin/settings',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(o)});await refresh();render();toast('Settings saved')}}
function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#039;','"':'&quot;'}[c]))}
$$('.nav button[data-page]').forEach(b=>b.onclick=()=>{state.page=b.dataset.page;render()});$('#logoutBtn').onclick=async()=>{await api('/api/admin/logout',{method:'POST'});location.reload()};$('#closeModal').onclick=()=>$('#modal').classList.add('hidden');$('#loginForm').onsubmit=async e=>{e.preventDefault();try{await api('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});await boot()}catch(err){$('#loginError').textContent=err.message}};boot();
})();
</script></body></html>
